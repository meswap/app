<div class="card">
  <h3 style="margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">Thống Kê Hợp Đồng & Giá</h3>
  
  <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 8px;">
      <span style="color: #94a3b8;">ME Còn Lại:</span>
      <strong id="rem-me" style="color: white;">0</strong>
    </div>
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 8px;">
      <span style="color: #94a3b8;">Dự Trữ MON:</span>
      <strong id="res-mon" style="color: white;">0.00</strong>
    </div>
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 8px;">
      <span style="color: #94a3b8;">Giá Hiện Tại:</span>
      <strong id="cur-price" style="color: #38bdf8;">0.00 MON</strong>
    </div>
  </div>

  <h4 style="margin: 0 0 12px 0; font-size: 0.95rem; color: #94a3b8;">Biến Động Giá</h4>
  
  <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center;">
    <div style="background: #0f172a; padding: 10px 3px; border-radius: 8px; border: 1px solid #334155;">
      <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">1H</div>
      <div id="change-1h" style="font-weight: bold; font-size: 0.78rem; color: white;">--</div>
    </div>

    <div style="background: #0f172a; padding: 10px 3px; border-radius: 8px; border: 1px solid #334155;">
      <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">1D</div>
      <div id="change-1d" style="font-weight: bold; font-size: 0.78rem; color: white;">--</div>
    </div>

    <div style="background: #0f172a; padding: 10px 3px; border-radius: 8px; border: 1px solid #334155;">
      <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">1W</div>
      <div id="change-1w" style="font-weight: bold; font-size: 0.78rem; color: white;">--</div>
    </div>

    <div style="background: #0f172a; padding: 10px 3px; border-radius: 8px; border: 1px solid #334155;">
      <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">1T</div>
      <div id="change-1t" style="font-weight: bold; font-size: 0.78rem; color: white;">--</div>
    </div>

    <div style="background: #0f172a; padding: 10px 3px; border-radius: 8px; border: 1px solid #334155;">
      <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">1N</div>
      <div id="change-1n" style="font-weight: bold; font-size: 0.78rem; color: white;">--</div>
    </div>
  </div>
</div>
