<div class="card">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h3 style="margin: 0;">Giao Dịch Swap</h3>
    <select id="swap-mode" style="background: #1e293b; color: white; border: 1px solid #334155; padding: 5px 10px; border-radius: 6px;">
      <option value="buy">Mua ME (Dùng MON)</option>
      <option value="sell">Bán ME (Lấy MON)</option>
    </select>
  </div>

  <div style="margin-bottom: 12px;">
    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 4px;">Bạn trả</label>
    <input type="number" id="pay-amount" placeholder="0.0" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; font-size: 1rem;">
  </div>

  <div style="margin-bottom: 20px;">
    <label style="font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 4px;">Bạn nhận (Ước tính)</label>
    <input type="text" id="receive-amount" placeholder="0.0" readonly style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #38bdf8; border-radius: 8px; font-size: 1rem; font-weight: bold;">
  </div>

  <button class="btn" id="swap-btn" style="width: 100%; padding: 12px; font-size: 1rem; font-weight: bold;">Xác Nhận Giao Dịch</button>
</div>
